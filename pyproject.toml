[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-harness"
version = "0.1.0"
description = "Experimental substrate for proof-carrying harness adaptation: canonical run artifacts, an append-only experience store, and Grafos-verified code references. No adaptive behavior yet, by design."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
proof-harness = "proof_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["proof_harness"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
